<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Shelbi Massaratti — Historical Preview</title>
  <style>
    *{box-sizing:border-box}html,body{height:100%;margin:0}body{display:grid;grid-template-rows:auto 1fr;background:#111;color:#fff;font:14px/1.4 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.bar{display:flex;align-items:center;gap:12px;min-height:52px;padding:9px 14px;background:#171717;border-bottom:1px solid #333}.bar a{color:#fff;text-decoration:none}.back{padding:7px 10px;border:1px solid #555;border-radius:6px}.title{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.status{margin-left:auto;color:#aaa;font-size:12px}iframe{display:block;width:100%;height:100%;border:0;background:#fff}.error{padding:32px;max-width:760px}.error h1{font-size:24px}.error code{color:#ff9fc8}
  </style>
</head>
<body>
  <div class="bar">
    <a class="back" href="./">← All previews</a>
    <div class="title" id="title">Loading preview…</div>
    <div class="status" id="status">Historical snapshot</div>
  </div>
  <iframe id="preview" title="Historical Shelbi Massaratti website preview" sandbox="allow-scripts allow-forms allow-popups allow-popups-to-escape-sandbox allow-same-origin"></iframe>
  <script>
    (() => {
      const params = new URLSearchParams(location.search);
      const ref = params.get('ref') || '';
      const label = params.get('name') || 'Historical site version';
      const owner = 'codeisafourletter';
      const repo = 'shelbimassaratti';
      const title = document.getElementById('title');
      const status = document.getElementById('status');
      const frame = document.getElementById('preview');
      title.textContent = label;

      if (!/^[0-9a-f]{7,40}$/i.test(ref)) {
        showError('The preview link is missing a valid commit reference.');
        return;
      }

      const rawBase = `https://raw.githubusercontent.com/${owner}/${repo}/${ref}/`;
      const assetBase = `https://raw.githack.com/${owner}/${repo}/${ref}/`;

      async function get(path) {
        const response = await fetch(rawBase + path, {cache:'no-store'});
        if (!response.ok) throw new Error(`${path}: HTTP ${response.status}`);
        return response.text();
      }

      async function assemble(source) {
        let html = source.replace(/^\s*---\s*\r?\n---\s*\r?\n/, '');
        const includePattern = /{%\s*include_relative\s+([^\s%]+)\s*%}/g;
        for (let pass = 0; pass < 8 && includePattern.test(html); pass++) {
          includePattern.lastIndex = 0;
          const matches = [...html.matchAll(includePattern)];
          const unique = [...new Set(matches.map(match => match[1]))];
          const replacements = new Map();
          await Promise.all(unique.map(async path => replacements.set(path, await get(path))));
          html = html.replace(includePattern, (_, path) => replacements.get(path) || '');
        }
        return html;
      }

      function makePortable(html) {
        const baseTag = `<base href="${assetBase}">`;
        if (/<head[^>]*>/i.test(html)) html = html.replace(/<head([^>]*)>/i, `<head$1>${baseTag}`);
        else html = baseTag + html;
        html = html.replace(/(href|src)=(['"])\/(?!\/)/gi, `$1=$2${assetBase}`);
        return html;
      }

      function showError(message) {
        status.textContent = 'Preview unavailable';
        frame.remove();
        const box = document.createElement('main');
        box.className = 'error';
        box.innerHTML = `<h1>Could not load this version</h1><p>${message}</p><p>Commit: <code>${ref || 'not supplied'}</code></p>`;
        document.body.appendChild(box);
      }

      (async () => {
        try {
          status.textContent = `Commit ${ref.slice(0,7)}`;
          const source = await get('index.html');
          const html = makePortable(await assemble(source));
          const doc = frame.contentWindow.document;
          doc.open();
          doc.write(html);
          doc.close();
        } catch (error) {
          console.error(error);
          showError('The historical files could not be assembled. ' + error.message);
        }
      })();
    })();
  </script>
</body>
</html>
