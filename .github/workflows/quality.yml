name: Validate website changes

on:
  pull_request:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build site
        run: python tools/build_site.py

      - name: Validate generated site
        run: python tools/validate_site.py --site _site

      - name: Set up Node.js for inquiry tests
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test inquiry message preparation
        run: node --test tests/*.test.cjs

      - name: Install browser test tooling
        run: npm ci

      - name: Install Chromium for journey checks
        run: npx playwright install --with-deps chromium

      - name: Test artist and operator journeys
        run: npm run test:browser
